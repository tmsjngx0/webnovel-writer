name: 리뷰 — 읽다가 이상한 곳
description: 읽다가 걸린 부분을 적습니다. 종류는 고르지 않아도 됩니다.
title: "[리뷰] "
body:
  - type: input
    id: chapter
    attributes:
      label: 회차
      description: 몇 화인지 숫자만 적어도 됩니다.
      placeholder: "3"
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: 문제 부분
      description: 원고에서 그 부분을 한두 문장 그대로 복사해 붙여 주세요. 이 문장이 위치를 찾는 기준이 됩니다.
      placeholder: |
        서준은 그 말이 목에 걸린 가시처럼 오래 남았다.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 뭐가 이상한지
      description: 형식 없이 편하게 적어 주세요. 이상하다는 느낌만 적어도 됩니다.
      placeholder: |
        여기서 갑자기 마음이 정리된 것처럼 읽힌다. 앞 장면에서 화가 나 있었는데 너무 빨리 가라앉는 느낌.
    validations:
      required: true
